name: 更新主页统计卡

on:
  schedule:
    - cron: "23 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出主页仓库
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 生成浅色统计卡
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          options: '{"username":"ycvk","bg_color":"FFF8EF","title_color":"96613D","text_color":"60554B","icon_color":"C58B50","hide_border":true,"border_radius":12,"card_width":360,"disable_animations":true,"custom_title":"GitHub Activity","show_icons":true,"hide_rank":true,"line_height":30,"hide":"contribs,issues"}'
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: 生成浅色语言卡
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: top-langs
          options: '{"username":"ycvk","bg_color":"FFF8EF","title_color":"96613D","text_color":"60554B","icon_color":"C58B50","hide_border":true,"border_radius":12,"card_width":360,"disable_animations":true,"custom_title":"Top Languages","layout":"compact","langs_count":6,"hide":"javascript,css,html"}'
          path: profile/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: 生成深色统计卡
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          options: '{"username":"ycvk","bg_color":"26211D","title_color":"E7B98A","text_color":"D9CABA","icon_color":"D3A16D","hide_border":true,"border_radius":12,"card_width":360,"disable_animations":true,"custom_title":"GitHub Activity","show_icons":true,"hide_rank":true,"line_height":30,"hide":"contribs,issues"}'
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: 生成深色语言卡
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: top-langs
          options: '{"username":"ycvk","bg_color":"26211D","title_color":"E7B98A","text_color":"D9CABA","icon_color":"D3A16D","hide_border":true,"border_radius":12,"card_width":360,"disable_animations":true,"custom_title":"Top Languages","layout":"compact","langs_count":6,"hide":"javascript,css,html"}'
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: 保存统计卡
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "更新主页统计卡"
          git push
